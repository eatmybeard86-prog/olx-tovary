name: Публікація сайту

# Сайт публікується на GitHub Pages при кожній зміні коду.
# Оголошення збирає Google Apps Script (apps-script/Code.gs), сайт бере їх звідти.
on:
  push:
    paths: ['index.html', 'app.js', 'style.css', 'config.js', '.github/workflows/update.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Зібрати сайт
        run: mkdir _site && cp index.html app.js style.css config.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
